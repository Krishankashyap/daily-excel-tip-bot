name: Daily Excel Tip

on:
  schedule:
    # 02:30 UTC = 08:00 IST, every day
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-tip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate today's tip
        run: python tip_bot.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TIP_OF_THE_DAY.md
          git diff --cached --quiet || git commit -m "Daily Excel tip"
          git push
